<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashenafi Zewdu — Artist & Architect</title>
    <meta
      name="description"
      content="Portfolio of Ashenafi Zewdu, Ethiopian artist and architect working in different mediums including cowhide, connecting visual art with architecture."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("az-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
